<div class="promoter-controls">
    <div class="promoter-selector">
        <label for="promoterSelect">Promoter:</label>
        <select id="promoterSelect" onchange="handlePromoterSelectChange()">

        </select>
        <button onclick="loadSelectedPromoter()" class="btn-primary">Show Promoter</button>
    </div>
    <div class="share-container">
        <button onclick="sharePromoterLink()" class="btn-secondary">🔗 Copy Shareable Link</button>
        <button id="refreshDataBtn" onclick="refreshDirectoryData()" class="btn-secondary"
            title="Bypasses the cache to fetch the latest directory data immediately">🔄 Refresh Data</button>
    </div>
</div>
